name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x64
            name: sleekdo-linux-x64
          - os: ubuntu-latest
            target: linux-arm64
            name: sleekdo-linux-arm64
          - os: macos-latest
            target: darwin-arm64
            name: sleekdo-macos-arm64
          - os: macos-latest
            target: darwin-x64
            name: sleekdo-macos-x64
          - os: windows-latest
            target: win-x64
            name: sleekdo-windows-x64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Create binary
        run: |
          cp bin/sleekdo.js dist/sleekdo && chmod +x dist/sleekdo

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: dist/*
          retention-days: 30
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Create tarballs (Linux/macOS)
        run: |
          cd dist
          for dir in */; do
            name="${dir%/}"
            if [ -d "$name" ] && [[ "$name" != *"windows"* ]]; then
              tar -czf "${name}.tar.gz" -C "$name" .
              sha256sum "${name}.tar.gz" > "${name}.tar.gz.sha256"
            fi
          done

      - name: Create zip (Windows)
        run: |
          cd dist
          for dir in */; do
            name="${dir%/}"
            if [ -d "$name" ] && [[ "$name" == *"windows"* ]]; then
              if command -v zip &> /dev/null; then
                (cd "$name" && zip -r "../${name}.zip" .)
              else
                python3 -m zipfile -c "${name}.zip" "$name"/*
              fi
              sha256sum "${name}.zip" > "${name}.zip.sha256"
            fi
          done

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
            dist/*.zip
            dist/*.zip.sha256
          draft: false
          prerelease: ${{ contains(github.ref, 'alpha') || contains(github.ref, 'beta') || contains(github.ref, 'rc') }}
          generate_release_notes: true

